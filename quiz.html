<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Voice Quiz (Blind Friendly)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .quiz-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 25px;
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
      text-align: center;
    }

    h1 {
      color: #4caf50;
      margin-bottom: 20px;
    }

    .question {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .options {
      text-align: left;
      margin-bottom: 20px;
    }

    .option {
      margin: 8px 0;
      padding: 8px;
      background-color: #222;
      border-radius: 5px;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .btn.paused {
      background-color: #f44336;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>HTML Voice Quiz</h1>
  <div id="question" class="question">Loading question...</div>
  <div id="options" class="options"></div>
  <div id="result" class="result"></div>

  <button id="startBtn" class="btn">🎙️ Start Listening</button>
  <button id="voiceToggle" class="btn">🔊 Voice: ON</button>
  <button id="backBtn" class="btn" onclick="goBack()">⬅️ Back to Course Section</button>
</div>

<script>
  const quizData = [
    {
      question: "What does HTML stand for?",
      options: ["Hyper Text Markup Language", "Home Tool Markup Language", "Hyperlinks and Text Markup Language", "High-level Machine Language"],
      answer: "A"
    },
    {
      question: "Which tag is used to create a hyperlink?",
      options: ["<a>", "<link>", "<href>", "<hyperlink>"],
      answer: "A"
    },
    {
      question: "Which HTML tag is used to insert an image?",
      options: ["<img>", "<image>", "<src>", "<picture>"],
      answer: "A"
    },
    {
      question: "Which tag is used for an ordered list?",
      options: ["<ol>", "<ul>", "<list>", "<order>"],
      answer: "A"
    },
    {
      question: "Which tag defines the largest heading?",
      options: ["<h1>", "<h6>", "<header>", "<head>"],
      answer: "A"
    }
  ];

  const synth = window.speechSynthesis;
  let currentQuestion = 0;
  let score = 0;
  let listening = false;
  let voiceEnabled = true;
  let stopped = false;

  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const resultEl = document.getElementById("result");
  const startBtn = document.getElementById("startBtn");
  const voiceToggle = document.getElementById("voiceToggle");

  // Speak text
  function speak(text) {
    if (!voiceEnabled || stopped) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.9;
    utter.pitch = 1;
    synth.cancel();
    synth.speak(utter);
  }

  // Stop all speech
  function stopSpeech() {
    synth.cancel();
    stopped = true;
    recognition.stop();
  }

  // Load question
  function loadQuestion() {
    const q = quizData[currentQuestion];
    questionEl.textContent = `Q${currentQuestion + 1}: ${q.question}`;
    optionsEl.innerHTML = "";
    let labels = ["A", "B", "C", "D"];
    let textToSpeak = `Question ${currentQuestion + 1}: ${q.question}. `;

    q.options.forEach((opt, i) => {
      const div = document.createElement("div");
      div.className = "option";
      div.textContent = `${labels[i]}. ${opt}`;
      optionsEl.appendChild(div);
      textToSpeak += `Option ${labels[i]}: ${opt}. `;
    });

    textToSpeak += "Please say A, B, C, or D.";
    speak(textToSpeak);
  }

  // Check answer
  function checkAnswer(ans) {
    const correct = quizData[currentQuestion].answer;
    if (ans.toUpperCase() === correct) {
      score++;
      resultEl.textContent = "✅ Correct!";
      speak("Correct!");
      currentQuestion++;
      setTimeout(() => {
        if (currentQuestion < quizData.length) {
          loadQuestion();
          startListening();
        } else {
          showScore();
        }
      }, 2000);
    } else {
      resultEl.textContent = `❌ Wrong! The correct answer is ${correct}`;
      speak(`Wrong. The correct answer is ${correct}.`);
      setTimeout(() => startListening(), 2500);
    }
  }

  // Final score
  function showScore() {
    questionEl.textContent = "🎉 Quiz Completed!";
    optionsEl.innerHTML = "";
    resultEl.textContent = `You scored ${score} out of ${quizData.length}`;
    speak(`Quiz completed. You scored ${score} out of ${quizData.length}.`);
    startBtn.style.display = "none";
    voiceToggle.style.display = "none";
  }

  // Speech recognition setup
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.trim().toUpperCase();
    console.log("Heard:", transcript);
    if (["A", "B", "C", "D"].includes(transcript)) {
      checkAnswer(transcript);
    } else {
      speak("Please say A, B, C, or D.");
      startListening();
    }
  };

  recognition.onend = () => {
    listening = false;
    startBtn.textContent = "🎙️ Start Listening";
    startBtn.classList.remove("paused");
  };

  function startListening() {
    if (!listening && !stopped) {
      recognition.start();
      listening = true;
      startBtn.textContent = "🛑 Listening...";
      startBtn.classList.add("paused");
      speak("Listening for your answer. Say A, B, C, or D.");
    }
  }

  // Voice toggle
  voiceToggle.addEventListener("click", () => {
    voiceEnabled = !voiceEnabled;
    if (!voiceEnabled) {
      synth.cancel();
      voiceToggle.textContent = "🔇 Voice: OFF";
      voiceToggle.classList.add("paused");
    } else {
      voiceToggle.textContent = "🔊 Voice: ON";
      voiceToggle.classList.remove("paused");
      speak("Voice resumed.");
    }
  });

  // Start button
  startBtn.addEventListener("click", () => {
    if (!listening) {
      stopped = false;
      startListening();
    } else {
      recognition.stop();
      listening = false;
      startBtn.textContent = "🎙️ Start Listening";
    }
  });

  // Back button
  function goBack() {
    stopSpeech();
    window.location.href = "courses.html"; 
  }

  // On page unload
  window.addEventListener("beforeunload", stopSpeech);

  // Start quiz
  window.addEventListener("load", () => {
    speak("Welcome to the HTML voice quiz. This quiz is made for visually impaired users. I will read each question and the options. When you hear the question, say A, B, C, or D to answer.");
    setTimeout(() => loadQuestion(), 6000);
  });
</script>

</body>
</html>
