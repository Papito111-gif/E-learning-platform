<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HTML Voice Quiz (Blind Friendly)</title>
<style>
  body { font-family: Arial, sans-serif; background:#000; color:#fff; margin:0; padding:20px; }
  .quiz-container { max-width:700px; margin:30px auto; background:#111; padding:22px; border-radius:10px; }
  h1 { color:#4caf50; text-align:center; }
  .question { font-size:20px; margin:10px 0; }
  .options { margin-top:10px; }
  .option { background:#222; padding:12px; margin:6px 0; border-radius:8px; font-size:18px; }
  .result { margin-top:18px; font-weight:700; }
  .controls { text-align:center; margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button { padding:12px 18px; border-radius:8px; border:none; cursor:pointer; font-size:16px; }
  .primary { background:#4caf50; color:#fff; }
  .muted { background:#666; color:#fff; }
  .back-btn { background:#2196f3; color:#fff; }
</style>
</head>
<body>
  <div class="quiz-container" role="main" aria-live="polite">
    <h1>HTML Voice Quiz (Accessible)</h1>
    <div id="question" class="question">Loading…</div>
    <div id="options" class="options" aria-live="polite"></div>
    <div id="result" class="result" aria-live="assertive"></div>

    <div class="controls">
      <button id="startBtn" class="primary">🎙️ Start Listening</button>
      <button id="voiceToggle" class="primary">🔊 Voice: ON</button>
      <button id="backBtn" class="back-btn">⬅️ Back to Courses</button>
    </div>

    <div style="text-align:center; margin-top:12px; color:#bbb; font-size:13px;">
      Tip: say "A", "Option A", "First", or speak the option text.
    </div>
  </div>

<script>
/* ---------- QUIZ DATA (5 questions, all answers A) ---------- */
const quizData = [
  { question: "What does HTML stand for?", options: ["Hyper Text Markup Language","Home Tool Markup Language","Hyperlinks and Text Markup Language","High-level Machine Language"], answer: "A" },
  { question: "Which tag is used to create a hyperlink?", options: ["&lt;a&gt;","&lt;link&gt;","&lt;href&gt;","&lt;hyperlink&gt;"], answer: "A" },
  { question: "Which HTML tag is used to insert an image?", options: ["&lt;img&gt;","&lt;image&gt;","&lt;src&gt;","&lt;picture&gt;"], answer: "A" },
  { question: "Which tag is used for an ordered list?", options: ["&lt;ol&gt;","&lt;ul&gt;","&lt;list&gt;","&lt;order&gt;"], answer: "A" },
  { question: "Which tag defines the largest heading?", options: ["&lt;h1&gt;","&lt;h6&gt;","&lt;header&gt;","&lt;head&gt;"], answer: "A" }
];

let currentQuestion = 0;
let score = 0;
let voiceEnabled = true;
let expectingAnswer = false;
let recognitionActive = false;

const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const resultEl = document.getElementById('result');
const startBtn = document.getElementById('startBtn');
const voiceToggle = document.getElementById('voiceToggle');
const backBtn = document.getElementById('backBtn');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const supportsRecognition = !!SpeechRecognition;
const supportsTTS = 'speechSynthesis' in window;

if (!supportsRecognition) {
  resultEl.textContent = "Speech recognition not supported. Use Chrome browser.";
  startBtn.disabled = true;
}

function speakPromise(text) {
  return new Promise(resolve => {
    if (!voiceEnabled || !supportsTTS) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.onend = () => resolve();
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  });
}

function normalizeTranscript(raw) {
  if (!raw) return null;
  const t = raw.trim().toLowerCase();
  if (/^\s*[abcd]\s*$/.test(t)) return t.toUpperCase();
  if (t.includes("option a") || t.includes("answer a") || t.includes("first")) return "A";
  if (t.includes("option b") || t.includes("answer b") || t.includes("second")) return "B";
  if (t.includes("option c") || t.includes("answer c") || t.includes("third")) return "C";
  if (t.includes("option d") || t.includes("answer d") || t.includes("fourth")) return "D";
  const match = t.match(/\b([a-d])\b/);
  return match ? match[1].toUpperCase() : null;
}

let recognition;
if (supportsRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.continuous = false;
}

function startRecognitionAfterTTS() {
  if (!supportsRecognition || !voiceEnabled) return;
  setTimeout(() => {
    try {
      recognition.start();
      recognitionActive = true;
      startBtn.textContent = '🛑 Listening...';
    } catch {}
  }, 300);
}

if (supportsRecognition) {
  recognition.onresult = (ev) => {
    const transcript = ev.results[0][0].transcript.trim();
    recognitionActive = false;
    startBtn.textContent = '🎙️ Start Listening';
    expectingAnswer = false;
    handleSpokenAnswer(transcript);
  };
  recognition.onend = () => {
    recognitionActive = false;
    startBtn.textContent = '🎙️ Start Listening';
  };
  recognition.onerror = () => {
    recognitionActive = false;
    if (expectingAnswer && voiceEnabled) {
      speakPromise("Please repeat your answer.").then(() => startRecognitionAfterTTS());
    }
  };
}

async function loadQuestion() {
  expectingAnswer = false;
  resultEl.textContent = '';
  const q = quizData[currentQuestion];
  questionEl.textContent = `Q${currentQuestion+1}: ${q.question}`;
  optionsEl.innerHTML = q.options.map((opt, i) =>
    `<div class="option"><strong>${String.fromCharCode(65+i)}.</strong> ${opt}</div>`
  ).join('');

  let text = `Question ${currentQuestion+1}. ${q.question}. `;
  q.options.forEach((opt, i) => { text += `Option ${String.fromCharCode(65+i)}. ${opt.replace(/&lt;|&gt;/g,'')}. `; });
  text += "Say A, B, C, or D.";

  await speakPromise(text);
  if (!voiceEnabled) return;
  expectingAnswer = true;
  startRecognitionAfterTTS();
}

function handleSpokenAnswer(transcript) {
  const letter = normalizeTranscript(transcript);
  if (!letter) {
    speakPromise("I didn't catch that. Please say A, B, C, or D.").then(() => {
      expectingAnswer = true; startRecognitionAfterTTS();
    });
    return;
  }
  checkAnswer(letter);
}

function checkAnswer(letter) {
  const correct = quizData[currentQuestion].answer;
  if (letter === correct) {
    score++;
    resultEl.textContent = "✅ Correct!";
    speakPromise("Correct.").then(() => {
      currentQuestion++;
      currentQuestion < quizData.length ? loadQuestion() : endQuiz();
    });
  } else {
    resultEl.textContent = `❌ Wrong. The correct answer is ${correct}.`;
    speakPromise(`Wrong. The correct answer is ${correct}.`).then(() => {
      currentQuestion++;
      currentQuestion < quizData.length ? loadQuestion() : endQuiz();
    });
  }
}

function endQuiz() {
  const msg = `Quiz finished. You scored ${score} of ${quizData.length}.`;
  questionEl.textContent = "🎉 Quiz Completed!";
  optionsEl.innerHTML = "";
  resultEl.textContent = msg;
  speakPromise(msg);
  stopAllRecognitionAndSpeech();
}

function stopAllRecognitionAndSpeech() {
  expectingAnswer = false;
  if (recognitionActive) recognition.abort();
  recognitionActive = false;
  window.speechSynthesis.cancel();
}

voiceToggle.addEventListener("click", () => {
  voiceEnabled = !voiceEnabled;
  voiceToggle.textContent = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
  voiceToggle.classList.toggle("muted", !voiceEnabled);
  if (!voiceEnabled) stopAllRecognitionAndSpeech();
  else speakPromise("Voice resumed.").then(loadQuestion);
});

startBtn.addEventListener("click", () => {
  if (recognitionActive) {
    recognition.abort();
    recognitionActive = false;
    startBtn.textContent = "🎙️ Start Listening";
    return;
  }
  window.speechSynthesis.cancel();
  expectingAnswer = true;
  startRecognitionAfterTTS();
});

backBtn.addEventListener("click", () => {
  stopAllRecognitionAndSpeech();
  setTimeout(() => (window.location.href = "courses.html"), 200);
});

window.addEventListener("beforeunload", stopAllRecognitionAndSpeech);

(async function startQuiz() {
  await speakPromise("Welcome to the HTML voice quiz. Let's begin.");
  loadQuestion();
})();
</script>
</body>
</html>
